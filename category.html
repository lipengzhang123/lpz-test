    function getParam(name) {

    function renderCases(filter) {
        var html = "", count = 0;
        CASES.forEach(function (c) {
            if (filter === "all" || c.category === filter) {
                html += '<div class="simple-case-card" data-id="' + c.id + '">'
                    + '<div class="simple-case-img"><img src="' + c.cover + '" alt="' + c.title + '" loading="lazy" onerror="this.src=\'https://via.placeholder.com/600x400/0052cc/ffffff?text=HPS\'"></div>'
                    + '<div class="simple-case-info"><div class="simple-case-title">' + c.title + '</div><div class="simple-case-company">' + c.company + '</div></div></div>';
                count++;
            }
        });
        caseGrid.innerHTML = html;
        noResult.style.display = count === 0 ? "block" : "none";
        document.querySelectorAll(".simple-case-card").forEach(function (card) {
            card.addEventListener("click", function () { openModal(parseInt(this.getAttribute("data-id"))); });
        });
    }

    function openModal(id) {
        var c = CASES.find(function (x) { return x.id === id; });
        if (!c) return;
        var html = '<div class="detail-hero"><img src="' + c.cover + '" alt="' + c.title + '" onerror="this.src=\'https://via.placeholder.com/800x400/0052cc/ffffff?text=HPS\'"><span class="detail-badge">' + c.categoryName + '</span></div>'
            + '<div class="detail-content"><h2 class="detail-title">' + c.title + '</h2>'
            + '<div class="detail-meta"><span>' + c.company + '</span><span>🏅 ' + c.level + '</span><span>📅 ' + c.date + '</span></div>'
            + '<div class="detail-tags">' + c.tags.map(function(t){return '<span class="case-tag">'+t+'</span>';}).join('') + '</div>'
            + '<div class="detail-section"><h3>问题原因</h3><p>' + c.summary + '</p></div>'
            + '<div class="detail-section"><h3>解决思路与措施</h3><ul>' + c.approach.map(function(a){
                // 解析markdown中的imagetourl.lim图片URL并渲染为<img>
                // 支持两种格式：1) Markdown链接 [url](url)  2) 裸URL https://...
                var parts = a.split(/(\[https?:\/\/[^\]]+\]\(https?:\/\/[^)]+\.(?:png|jpg|jpeg|gif|webp)\)|https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp))/gi);
                return '<li>' + parts.map(function (p) {
                    if (/^https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp)/i.test(p)) {
                        return '<br><img src="' + p + '" alt="实施步骤配图" style="max-width:100%;margin:8px 0;border-radius:4px;" onerror="this.style.display=\'none\'">';
                    }
                    // Markdown链接格式 [url](url) → 提取URL
                    var mdMatch = p.match(/^\[(https?:\/\/[^\]]+\.(?:png|jpg|jpeg|gif|webp))\]\((https?:\/\/[^\)]+\.(?:png|jpg|jpeg|gif|webp))\)$/i);
                    if (mdMatch) {
                        return '<br><img src="' + mdMatch[1] + '" alt="实施步骤配图" style="max-width:100%;margin:8px 0;border-radius:4px;" onerror="this.style.display=\'none\'">';
                    }
                    // Markdown加粗 **text** → <strong>text</strong>
                    p = p.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                    return p;
                }).join("") + '</li>';
            }).join('') + '</ul></div>'
            + '<div class="detail-section"><h3>项目成果</h3><div class="detail-results">'
            + c.results.map(function(r){return '<div class="detail-result-card"><div class="detail-result-num">'+r.num+'</div><div class="detail-result-label">'+r.label+'</div></div>';}).join('')
            + '</div></div></div>';
        modalBody.innerHTML = html;
        modalOverlay.classList.add("open");
        document.body.style.overflow = "hidden";
    }

    function closeModal() { modalOverlay.classList.remove("open"); document.body.style.overflow = ""; }
    if (modalClose) modalClose.addEventListener("click", closeModal);
    if (modalOverlay) modalOverlay.addEventListener("click", function(e){ if(e.target===modalOverlay) closeModal(); });
    document.addEventListener("keydown", function(e){ if(e.key==="Escape"&&modalOverlay.classList.contains("open")) closeModal(); });

    if (menuToggle) menuToggle.addEventListener("click", function(){ menuToggle.classList.toggle("open"); mainNav.classList.toggle("open"); });
    document.querySelectorAll(".nav-link").forEach(function(link){ link.addEventListener("click", function(){ menuToggle.classList.remove("open"); mainNav.classList.remove("open"); }); });

})();
